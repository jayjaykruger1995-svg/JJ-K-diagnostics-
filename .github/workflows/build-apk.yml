name: Build JJK Diagnostics APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace
      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          keytool -genkeypair -v -keystore jjk-test-release.jks -storepass changeit -keypass changeit -alias jjkdiagnostics -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JJK Diagnostics, OU=JJK, O=JJK Diagnostics, L=Vrede, ST=Free State, C=ZA"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/jjk-diagnostics-aligned.apk
          "$BT/apksigner" sign --ks jjk-test-release.jks --ks-pass pass:changeit --key-pass pass:changeit --out app/build/outputs/apk/release/JJK-Diagnostics.apk app/build/outputs/apk/release/jjk-diagnostics-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/JJK-Diagnostics.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JJK-Diagnostics-installable
          path: app/build/outputs/apk/release/JJK-Diagnostics.apk
